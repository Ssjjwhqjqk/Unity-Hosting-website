<!DOCTYPE html>
<html lang="en">
<head>

<body>

    <div id="particles"></div>

            <div class="logo-area">

            <div class="nav-links">

            <h2 style="font-size: 3rem; margin-bottom: 40px; font-weight: 900;">Domain Plans</h2>

    <footer class="footer">
        © 2026 Unity Hosting • Premium Cloud Infrastructure

    <script>
        for(let i=0; i<80; i++){
            let d = document.createElement('div');
            d.className = 'particle';
            d.style.left = Math.random()*100+'%';
            d.style.top = Math.random()*100+'%';
            d.style.animationDuration = (Math.random()*10+10)+'s';
            d.style.opacity = Math.random();
            d.style.width = d.style.height = (Math.random()*4+2)+'px';
            document.getElementById('particles').appendChild(d);
        }
    </script>
