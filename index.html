<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Unity Hosting | Premium Infrastructure</title>

<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
.quick-nav{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:15px;
    margin-top:30px;
}

.quick-btn{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:22px;
    border-radius:14px;
    background:rgba(255,255,255,0.05);
    border:1px solid rgba(255,255,255,0.1);
    text-decoration:none;
    color:#fff;
    transition:0.25s;
    font-weight:600;
}

.quick-btn i{
    font-size:22px;
    margin-bottom:8px;
    color:#6c5ce7;
}

.quick-btn:hover{
    transform:translateY(-5px);
    border-color:#6c5ce7;
    background:rgba(108,92,231,0.15);
}

/* HEADER ACTION BUTTONS */
.nav-actions{
    display:flex;
    gap:10px;
    align-items:center;
    flex-wrap:wrap;
}

.action-btn{
    padding:8px 14px;
    border-radius:8px;
    text-decoration:none;
    font-weight:600;
    font-size:14px;
    transition:0.2s;
    color:#fff;
    border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.05);
}

.action-btn:hover{
    transform:translateY(-2px);
    border-color:#6c5ce7;
    background:rgba(108,92,231,0.15);
}

.client-btn{
    background:#6c5ce7;
    border:none;
}

.client-btn:hover{
    background:#5848d6;
}

@media(max-width:900px){
    .quick-nav{
        grid-template-columns:repeat(2,1fr);
    }
}

@media(max-width:500px){
    .quick-nav{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<!-- NAVBAR -->
<header class="navbar">
    <div class="nav-container">

        <div class="logo-area">
            <img src="./logo.jpg" class="nav-logo" alt="logo">
            <span class="brand-text">Unity <span class="accent-text">Hosting</span></span>
        </div>

        <div class="nav-actions">

            <a href="https://discord.gg/SBJPW7dRhM" class="action-btn">
                <i class="fa-brands fa-discord"></i> Discord
            </a>

            <a href="https://panel.unityhosting.online/" class="action-btn client-btn">
                <i class="fa-solid fa-user"></i> Client Panel
            </a>

            <a href="https://www.facebook.com/share/1GbAYg3ZsM/" class="action-btn">
                <i class="fa-brands fa-facebook"></i>
            </a>

            <a href="https://www.instagram.com/unityhosting_np?igsh=NXRjMzMwbDNka3U4" class="action-btn">
                <i class="fa-brands fa-instagram"></i>
            </a>

        </div>

    </div>
</header>

<!-- HERO -->
<section class="hero-section">
    <div class="hero-container">

        <div class="hero-content">

            <div class="premium-tag">
                🇳🇵 BUILT IN NEPAL • GLOBAL HOSTING NETWORK
            </div>

            <h1 class="hero-title">
                Fast & Reliable<br>
                <span class="gradient-title">Hosting Platform</span>
            </h1>

            <p class="hero-subtitle">
                High-performance infrastructure designed for speed, stability, and scalability.
            </p>

            <!-- QUICK NAV -->
            <div class="quick-nav">

                <a href="./minecraft.html" class="quick-btn">
                    <i class="fa-solid fa-gamepad"></i>
                    Minecraft
                </a>

                <a href="./vps.html" class="quick-btn">
                    <i class="fa-solid fa-server"></i>
                    VPS
                </a>

                <a href="./domains.html" class="quick-btn">
                    <i class="fa-solid fa-globe"></i>
                    Domains
                </a>

            </div>

        </div>

    </div>
</section>

<!-- FOOTER -->
<footer class="site-footer">
    <p>© 2026 Unity Hosting • Built in Nepal 🇳🇵</p>
</footer>

</body>
</html>
